<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Happy New Year My Love</title>

    <!-- IMPORT FONTS DỄ THƯƠNG TỪ GOOGLE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-color: #ff006e;
            --secondary-color: #ffbe0b;
            --cute-pink: #ff99c8;
            --glow-color: #ffc2e2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            /* Font mặc định tròn trịa */
            overflow: hidden;
            background: #000;
            height: 100vh;
            height: -webkit-fill-available;
            position: relative;
            touch-action: none;
        }

        /* Canvas pháo hoa */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #1a0b2e 0%, #000000 100%);
            /* Nền tím than nhẹ cho thơ mộng */
        }

        /* UI Chung */
        .overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            transition: opacity 0.8s ease;
        }

        .action-btn {
            padding: 18px 45px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(45deg, #ff5e99, #ff99c8);
            /* Màu nút cute hơn */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 94, 153, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 101;
            animation: pulseBtn 2s infinite;
            transition: transform 0.2s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        @keyframes pulseBtn {
            0% {
                box-shadow: 0 0 20px rgba(255, 94, 153, 0.4);
                transform: scale(1);
            }

            50% {
                box-shadow: 0 0 50px rgba(255, 94, 153, 0.8);
                transform: scale(1.05);
            }

            100% {
                box-shadow: 0 0 20px rgba(255, 94, 153, 0.4);
                transform: scale(1);
            }
        }

        /* Đếm ngược */
        #countdownOverlay {
            z-index: 90;
            pointer-events: none;
            display: none;
        }

        .countdown-number {
            font-family: 'Dancing Script', cursive;
            font-size: 30vmin;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 40px var(--cute-pink);
            opacity: 0;
            transform: scale(0.5);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }

            100% {
                opacity: 0;
                transform: scale(1.5);
            }
        }

        /* Nội dung chính */
        #mainContent {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: none;
            pointer-events: none;
        }

        #mainMessage {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 900px;
            z-index: 20;
            min-height: 150px;
        }

        .message-line {
            font-family: 'Dancing Script', cursive;
            /* Font viết tay lãng mạn */
            font-size: 8vw;
            line-height: 1.3;
            font-weight: 700;
            color: #fff0f5;
            /* Màu trắng hồng nhẹ */

            /* Hiệu ứng Neon mềm mại hơn */
            text-shadow:
                0 0 5px #fff,
                0 0 15px #ff99c8,
                0 0 30px #ff5e99,
                0 0 40px #ff006e;

            display: inline;
            white-space: pre-wrap;
        }

        /* Con trỏ nhấp nháy xịn hơn */
        .cursor {
            display: inline-block;
            width: 4px;
            height: 1em;
            /* Chiều cao bằng dòng chữ */
            background-color: #fff;
            margin-left: 5px;
            vertical-align: middle;
            /* Căn giữa dòng */
            box-shadow: 0 0 10px #fff;
            animation: blink 0.8s infinite;
            border-radius: 2px;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        @media (min-width: 768px) {
            .message-line {
                font-size: 4.5rem;
            }

            .cursor {
                width: 5px;
            }
        }

        /* Tin nhắn bay */
        #messagesContainer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            font-family: 'Quicksand', sans-serif;
            /* Nền bóng kính trong suốt ánh hồng */
            background: rgba(255, 182, 193, 0.15);
            backdrop-filter: blur(5px);
            padding: 12px 25px;
            border-radius: 50px;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255, 192, 203, 0.3);
            bottom: -60px;
            animation: floatUp linear forwards;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        @keyframes floatUp {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            10% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                bottom: 95%;
                opacity: 0;
                transform: scale(0.9);
            }
        }
    </style>
</head>

<body>
    <canvas id="fireworksCanvas"></canvas>

    <!-- Màn hình bắt đầu -->
    <div id="startScreen" class="overlay-screen">
        <button id="startButton" class="action-btn">Bắt đầu nào ❤️</button>
    </div>

    <!-- Màn hình kết thúc / Xem lại -->
    <div id="endScreen" class="overlay-screen" style="display: none; opacity: 0;">
        <button id="replayButton" class="action-btn">Xem lại nhé ↺</button>
    </div>

    <!-- Màn hình đếm ngược -->
    <div id="countdownOverlay" class="overlay-screen" style="background: transparent;">
        <div id="countdownNumber" class="countdown-number"></div>
    </div>

    <div id="mainContent">
        <div id="mainMessage"></div>
        <div id="messagesContainer"></div>
    </div>

    <audio id="bgMusic" preload="auto">
        <source src="HPNY.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ==========================================
        // CẤU HÌNH NỘI DUNG (EDIT TẠI ĐÂY)
        // ==========================================

        const MAIN_MESSAGES = [
            "Chúc Mừng Năm Mới 2026 🎉",
            "Gửi đến em, cô gái đáng yêu của anh ❤️",
            "Cảm ơn em vì đã khiến năm qua trở nên thật rực rỡ ✨",
            "Năm mới hãy luôn cười tươi và hạnh phúc như hoa nhé 🌸",
            "Chúc em luôn xinh đẹp, bình an và gặp nhiều may mắn 🍀",
            "Chúng mình cùng nhau viết tiếp những chương tuyệt vời phía trước nha 📖",
            "Anh sẽ luôn ở bên và yêu thương em 💕",
            "Happy New Year My Love! 🎆"
        ];

        // Tốc độ gõ chữ (ms/ký tự) -> 100 là vừa phải
        const TYPING_SPEED = 100;

        // Thời gian nghỉ để đọc xong 1 câu (ms)
        const READING_TIME = 2000;

        // QUAN TRỌNG: Thời gian chờ sau khi gõ hết chữ để nhạc chạy tiếp (ms)
        // 60000 = 60 giây. Hãy chỉnh số này để khớp với đoạn điệp khúc bài hát.
        const MUSIC_WAIT_TIME = 60000;

        const BUBBLE_MESSAGES = [
            "Yêu em ❤️", "Xinh đẹp 😍", "May mắn 🍀",
            "Love You 3000 💖", "Mãi bên nhau 👫", "Bình an 🙏",
            "Cute xỉu 🥰", "Thành công 🌟", "Happy New Year 🎉",
            "70Kg 🙏", "Tốt nghiệp xuất sắc 🎓", "Siêu sạch sẽ 😍 ",
            "Du lịch khắp nơi ✈️", "Đọc sách mỗi ngày 📚", "Ngủ đủ 8 tiếng 😴"
        ];

        // ==========================================
        // LOGIC PHÁO HOA
        // ==========================================
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let isFireworksActive = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Màu pháo hoa Pastel dễ thương
        const colors = ['#ff99c8', '#fcf6bd', '#d0f4de', '#a9def9', '#e4c1f9', '#ffffff'];

        class Firework {
            constructor() {
                this.x = Math.random() * (width * 0.9) + (width * 0.05);
                this.y = height;
                this.targetY = Math.random() * (height * 0.6) + (height * 0.1);
                this.speed = Math.random() * 4 + 10;
                this.angle = -Math.PI / 2;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.isHeart = Math.random() < 0.4; // Tăng tỉ lệ trái tim lên 40%
            }

            update() {
                this.y -= this.speed;
                this.speed *= 0.98;

                if (this.speed <= 2 || this.y <= this.targetY) {
                    this.explode();
                    return false;
                }
                return true;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            explode() {
                const particleCount = this.isHeart ? 80 : 150;
                if (this.isHeart) {
                    for (let i = 0; i < particleCount; i++) {
                        const t = (Math.PI * 2 * i) / particleCount;
                        const dx = 16 * Math.pow(Math.sin(t), 3);
                        const dy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                        const power = Math.random() * 0.8 + 2.5;
                        particles.push(new Particle(this.x, this.y, this.color, dx * power / 16, dy * power / 16, true));
                    }
                } else {
                    for (let i = 0; i < particleCount; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const velocity = Math.random() * 8 + 2;
                        const dx = Math.cos(angle) * velocity;
                        const dy = Math.sin(angle) * velocity;
                        particles.push(new Particle(this.x, this.y, this.color, dx, dy, false));
                    }
                }
            }
        }

        class Particle {
            constructor(x, y, color, vx, vy, isHeart) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.alpha = 1;
                this.friction = 0.96;
                this.gravity = 0.06;
                this.decay = Math.random() * 0.008 + 0.004;
                this.sparkle = Math.random() < 0.5;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                return this.alpha > 0;
            }

            draw() {
                ctx.save();
                let opacity = this.alpha;
                if (this.sparkle) opacity *= Math.random() * 0.5 + 0.5;
                ctx.globalAlpha = opacity;
                ctx.globalCompositeOperation = 'lighter';

                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Glow effect
                ctx.beginPath();
                ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${hexToRgb(this.color)}, ${opacity * 0.3})`;
                ctx.fill();
                ctx.restore();
            }
        }

        function hexToRgb(hex) {
            var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '255, 255, 255';
        }

        let fireworks = [];
        let particles = [];

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            if (isFireworksActive) {
                if (Math.random() < 0.06) fireworks.push(new Firework());
            }

            fireworks = fireworks.filter(f => {
                f.draw();
                return f.update();
            });

            particles = particles.filter(p => {
                p.draw();
                return p.update();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // ==========================================
        // QUẢN LÝ FLOW & GÕ CHỮ
        // ==========================================

        const startBtn = document.getElementById('startButton');
        const replayBtn = document.getElementById('replayButton');
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownNumber = document.getElementById('countdownNumber');
        const mainContent = document.getElementById('mainContent');
        const messageContainer = document.getElementById('mainMessage');
        const bubbleContainer = document.getElementById('messagesContainer');
        const music = document.getElementById('bgMusic');

        let bubbleInterval;

        startBtn.addEventListener('click', async () => { await startShow(); });
        replayBtn.addEventListener('click', async () => {
            endScreen.style.opacity = '0';
            setTimeout(() => endScreen.style.display = 'none', 500);
            await startShow(true);
        });

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        async function startShow(skipCountdown = false) {
            startScreen.style.display = 'none';
            endScreen.style.display = 'none';
            mainContent.style.display = 'block';
            isFireworksActive = true;
            messageContainer.innerHTML = '';

            music.volume = 0;
            music.currentTime = 0;
            try { await music.play(); music.pause(); } catch (e) { }

            if (!skipCountdown) {
                countdownOverlay.style.display = 'flex';
                await runCountdown(3);
                await runCountdown(2);
                await runCountdown(1);
                countdownOverlay.style.display = 'none';
            }

            music.volume = 1;
            music.play();

            runBubbleMessages();
            await runTypewriterMessages();
        }

        function runCountdown(num) {
            return new Promise(resolve => {
                countdownNumber.textContent = num;
                countdownNumber.style.animation = 'none';
                void countdownNumber.offsetWidth;
                countdownNumber.style.animation = 'popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
                setTimeout(resolve, 1000);
            });
        }

        async function runTypewriterMessages() {
            for (let i = 0; i < MAIN_MESSAGES.length; i++) {
                if (!isFireworksActive) return;

                // Tạo dòng mới và con trỏ
                messageContainer.innerHTML = `
                    <span class="message-line"></span><span class="cursor"></span>
                `;
                const lineElement = messageContainer.querySelector('.message-line');
                const currentText = MAIN_MESSAGES[i];
                const characters = Array.from(currentText);

                for (let char of characters) {
                    if (!isFireworksActive) return;
                    lineElement.textContent += char;
                    await sleep(TYPING_SPEED);
                }

                await sleep(READING_TIME);
            }

            // --- PHẦN MỚI: CHỜ NHẠC CHẠY HẾT ---
            // Sau khi gõ xong câu cuối, không tắt ngay mà chờ nhạc
            if (isFireworksActive) {
                // Xóa con trỏ nhấp nháy đi cho đỡ vướng mắt khi đang chill
                const cursor = messageContainer.querySelector('.cursor');
                if (cursor) cursor.style.display = 'none';

                // Đợi thêm một khoảng thời gian (MUSIC_WAIT_TIME)
                await sleep(MUSIC_WAIT_TIME);
            }

            endShow();
        }

        function runBubbleMessages() {
            bubbleInterval = setInterval(() => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = BUBBLE_MESSAGES[Math.floor(Math.random() * BUBBLE_MESSAGES.length)];
                bubble.style.left = Math.random() * 80 + 10 + '%';
                bubble.style.animationDuration = (Math.random() * 5 + 10) + 's';
                bubbleContainer.appendChild(bubble);
                setTimeout(() => bubble.remove(), 15000);
            }, 1200);
        }

        function endShow() {
            isFireworksActive = false;
            clearInterval(bubbleInterval);

            // Fade out nhạc từ từ
            const fadeAudio = setInterval(() => {
                if (music.volume > 0.05) music.volume -= 0.05;
                else {
                    music.volume = 0;
                    music.pause();
                    clearInterval(fadeAudio);
                }
            }, 200);

            setTimeout(() => {
                messageContainer.innerHTML = '';
                endScreen.style.display = 'flex';
                setTimeout(() => endScreen.style.opacity = '1', 50);
            }, 3000);
        }
    </script>
</body>

</html>
